<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lil Bot Emoticon Builder</title>
<style>
:root{--c:#19f7ff;--p:#ff2daa;--bg:#070914;--panel:#11162c;--text:#e9fdff;--muted:#9ca9c9}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#252052,transparent 32%),radial-gradient(circle at 90% 0,#4b1248,transparent 28%),var(--bg);color:var(--text);font:14px Inter,Segoe UI,sans-serif}.app{max-width:1280px;margin:auto;padding:24px}.top{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:20px}.tag{color:var(--c);font-size:12px;font-weight:800;letter-spacing:.18em}h1{margin:4px 0 2px;font-size:clamp(28px,5vw,48px)}.muted{color:var(--muted)}button,select,input{font:inherit}.layout{display:grid;grid-template-columns:minmax(520px,1.25fr) minmax(360px,.75fr);gap:20px}.card{background:linear-gradient(145deg,#141933ee,#090c1cf5);border:1px solid #19f7ff22;border-radius:20px;box-shadow:0 20px 65px #0009}.preview{padding:24px}.shell{padding:15px;background:#1a1f2d;border:5px solid #343d54;border-radius:54px;box-shadow:0 20px 45px #000b}.screen{overflow:hidden;border:3px solid #435069;border-radius:38px;background:#02040d}.screen canvas{display:block;width:100%;aspect-ratio:320/170;image-rendering:pixelated}.caption{display:flex;justify-content:space-between;margin-top:12px;color:var(--muted);font-size:12px}.library{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:22px}.preset{padding:8px;background:#0a0e1e;border:1px solid #2d3652;border-radius:11px;color:var(--text);cursor:pointer}.preset:hover,.preset.active{border-color:var(--c);box-shadow:0 0 14px #19f7ff22}.preset canvas{display:block;width:100%;aspect-ratio:320/170;background:#02040d;border-radius:7px;image-rendering:pixelated}.preset span{display:block;margin-top:5px;font-size:11px}.controls{padding:20px;max-height:820px;overflow:auto}.controls h2{margin:0 0 4px}.controls h3{margin:19px 0 9px;color:#c7d2ee;font-size:12px;letter-spacing:.12em;text-transform:uppercase}.row{display:grid;grid-template-columns:92px 1fr;gap:9px;align-items:center;margin:8px 0}.row label{color:#bdc8e4}.row select,.row input[type=range]{width:100%}select,button{border:1px solid #34405e;background:#171d33;color:var(--text);border-radius:10px;padding:9px;font-weight:700}input[type=range]{accent-color:var(--p)}.val{color:var(--c);font-variant-numeric:tabular-nums}.range{display:grid;grid-template-columns:1fr 34px;gap:8px;align-items:center}.checks{display:flex;gap:18px;flex-wrap:wrap}.checks label{color:#bdc8e4}.checks input{accent-color:var(--p)}.colors{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.color{padding:8px;border:1px solid #2d3652;border-radius:10px;color:var(--muted);font-size:11px}.color input{display:block;width:100%;height:34px;margin-top:5px;border:0;background:none}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.actions button:first-child{background:linear-gradient(100deg,var(--c),#7efbff);color:#071018;border:0}.readout{margin-top:12px;padding:10px;background:#080b17;border:1px solid #2d3652;border-radius:10px;color:#91a0c2;font:11px ui-monospace,Consolas,monospace;word-break:break-word}.toast{height:18px;margin-top:8px;color:var(--c);font-size:12px}@media(max-width:900px){.layout{grid-template-columns:1fr}.library{grid-template-columns:repeat(3,1fr)}.controls{max-height:none}.app{padding:14px}}
</style></head><body><main class="app"><div class="top"><div><div class="tag">320 × 170 EMOTICON DISPLAY</div><h1>Lil Bot Face Builder</h1><div class="muted">Build expressions from a reusable alphabet of glowing symbols.</div></div><button onclick="location.href='index.html'">Interaction lab →</button></div>
<section class="layout"><div class="card preview"><div class="shell"><div class="screen"><canvas id="face" width="320" height="170"></canvas></div></div><div class="caption"><span>Exact hardware resolution</span><span id="faceName">Calm / neutral</span></div><div style="margin-top:12px"><button onclick="location.href='display-preview.html'">Preview animations on display →</button></div><div class="library" id="library"></div></div>
<aside class="card controls"><h2>Emoticon controls</h2><p class="muted">Mix each symbol independently or begin with a preset.</p><h3>Symbol alphabet</h3>
<div class="row"><label>Left eye</label><select id="left"></select></div><div class="row"><label>Right eye</label><select id="right"></select></div><div class="row"><label>Mouth</label><select id="mouth"></select></div>
<div class="checks"><label><input id="linked" type="checkbox" checked> Link eyes</label><label><input id="accent" type="checkbox" checked> Two-color mouth</label><label><input id="pixel" type="checkbox" checked> Pixel edges</label></div>
<h3>Geometry</h3><div id="ranges"></div><h3>Palette</h3><div class="colors"><label class="color">Eyes<input id="eyeColor" type="color"></label><label class="color">Mouth<input id="mouthColor" type="color"></label><label class="color">Screen<input id="bgColor" type="color"></label></div>
<h3>Export</h3><div class="actions"><button id="png">Download PNG</button><button id="json">Download settings</button><button id="copy">Copy settings</button><button id="reset">Reset neutral</button></div><div class="toast" id="toast"></div><div class="readout" id="readout"></div></aside></section></main>
<script>
const eyeTypes={dot:'● Dot',bar:'— Bar',arc:'⌒ Closed arc',caret:'⌃ Happy caret',squint:'> Squint',circle:'○ Circle',vertical:'▮ Vertical',cup:'◡ Sleepy cup',angry:'Angled wedge',x:'× Error X',spiral:'@ Spiral',heart:'♥ Heart',spark:'✦ Sparkle'};
const mouthTypes={tiny:'Tiny smile',smile:'Wide smile',frown:'Frown',line:'— Flat',o:'○ Surprised',three:'3 Kiss',uwu:'ω W mouth',open:'Open smile',tongue:'Tongue out',zigzag:'Worried zigzag',none:'None'};
const base={name:'Idle / neutral',left:'dot',right:'dot',mouth:'tiny',gap:184,eyeSize:48,eyeY:87,mouthSize:42,mouthY:131,stroke:4,glow:12,eyeColor:'#19f7ff',mouthColor:'#ff2daa',bgColor:'#02040d',linked:true,accent:true,pixel:true};
const presets={idle:{...base},typing:{...base,name:'Typing',left:'vertical',right:'vertical',mouth:'tiny'},browsing:{...base,name:'Browsing',left:'bar',right:'circle',mouth:'three',linked:false},music:{...base,name:'Music',left:'arc',right:'arc',mouth:'smile'},gaming:{...base,name:'Gaming',left:'angry',right:'angry',mouth:'line'},notification:{...base,name:'Notification',left:'dot',right:'bar',mouth:'o',linked:false},loading:{...base,name:'Loading',left:'bar',right:'bar',mouth:'line'},error:{...base,name:'Error',left:'x',right:'x',mouth:'zigzag'},sleep:{...base,name:'Locked / sleeping',left:'cup',right:'cup',mouth:'three',eyeColor:'#8b3dff'}};
const saved=JSON.parse(localStorage.getItem('lilbot-emoticon')||'{}');let cfg={...base,...saved};if(saved.version!==3){Object.assign(cfg,{gap:184,eyeSize:48,eyeY:87,mouthSize:42,mouthY:131,stroke:4,glow:12,version:3})}
const $=id=>document.getElementById(id),canvas=$('face'),ctx=canvas.getContext('2d');
const left=$('left'),right=$('right'),mouth=$('mouth'),linked=$('linked'),accent=$('accent'),pixel=$('pixel');
const library=$('library'),faceName=$('faceName'),readout=$('readout'),toast=$('toast');
const png=$('png'),json=$('json'),copy=$('copy'),reset=$('reset');
for(const [k,v] of Object.entries(eyeTypes)){left.add(new Option(v,k));right.add(new Option(v,k))}for(const [k,v] of Object.entries(mouthTypes))mouth.add(new Option(v,k));
const rangeSpecs=[['gap','Eye spacing',90,190],['eyeSize','Eye size',12,52],['eyeY','Eye height',45,100],['mouthSize','Mouth size',10,52],['mouthY','Mouth height',90,145],['stroke','Line width',2,10],['glow','Glow',0,18]];
for(const [id,label,min,max] of rangeSpecs)$('ranges').insertAdjacentHTML('beforeend',`<div class="row"><label>${label}</label><div class="range"><input id="${id}" type="range" min="${min}" max="${max}"><span class="val" id="${id}V"></span></div></div>`);
function pathEye(c,type,x,y,s,mirror=false){c.save();c.translate(x,y);if(mirror)c.scale(-1,1);c.beginPath();const h=s/2,w=s/2;
 if(type==='dot'){c.arc(0,0,h,0,Math.PI*2);c.fill()}else if(type==='bar'){c.moveTo(-w,0);c.lineTo(w,0);c.stroke()}else if(type==='arc'){c.arc(0,4,w,Math.PI,Math.PI*2);c.stroke()}else if(type==='caret'){c.moveTo(-w,h/3);c.lineTo(0,-h/2);c.lineTo(w,h/3);c.stroke()}else if(type==='squint'){c.moveTo(-w,-h);c.lineTo(w,0);c.lineTo(-w,h);c.stroke()}else if(type==='circle'){c.arc(0,0,h,0,Math.PI*2);c.stroke()}else if(type==='vertical'){c.roundRect(-h/3,-h,h*.66,h*2,h/4);c.fill()}else if(type==='cup'){c.arc(0,-4,w,0,Math.PI);c.stroke()}else if(type==='angry'){c.moveTo(-w,-h);c.lineTo(w,-h/3);c.lineTo(w/2,h);c.lineTo(-w/2,h/2);c.closePath();c.stroke()}else if(type==='x'){c.moveTo(-h,-h);c.lineTo(h,h);c.moveTo(h,-h);c.lineTo(-h,h);c.stroke()}else if(type==='spiral'){for(let a=0;a<Math.PI*5;a+=.12){let r=a/Math.PI*s/7,px=Math.cos(a)*r,py=Math.sin(a)*r;if(a===0)c.moveTo(px,py);else c.lineTo(px,py)}c.stroke()}else if(type==='heart'){c.moveTo(0,h);c.bezierCurveTo(-w,-h/4,-w,-h,0,-h/3);c.bezierCurveTo(w,-h,w,-h/4,0,h);c.fill()}else if(type==='spark'){c.moveTo(0,-h);c.lineTo(h/3,-h/3);c.lineTo(h,0);c.lineTo(h/3,h/3);c.lineTo(0,h);c.lineTo(-h/3,h/3);c.lineTo(-h,0);c.lineTo(-h/3,-h/3);c.closePath();c.fill()}c.restore()}
function pathMouth(c,type,x,y,s){c.save();c.translate(x,y);c.beginPath();let w=s/2,h=s*.35;if(type==='tiny'||type==='smile'){c.arc(0,-h/2,w,0,Math.PI);c.stroke()}else if(type==='frown'){c.arc(0,h,w,Math.PI,Math.PI*2);c.stroke()}else if(type==='line'){c.moveTo(-w,0);c.lineTo(w,0);c.stroke()}else if(type==='o'){c.ellipse(0,0,w*.55,h,0,0,Math.PI*2);c.stroke()}else if(type==='three'){c.arc(-w/4,-h/2,w/2,-Math.PI/2,Math.PI/2);c.arc(-w/4,h/2,w/2,-Math.PI/2,Math.PI/2);c.stroke()}else if(type==='uwu'){c.arc(-w/2,-h/3,w/2,0,Math.PI);c.arc(w/2,-h/3,w/2,0,Math.PI);c.stroke()}else if(type==='open'){c.arc(0,-h/2,w,0,Math.PI);c.lineTo(-w,-h/2);c.closePath();c.stroke()}else if(type==='tongue'){c.arc(0,-h/2,w,0,Math.PI);c.moveTo(-w/3,h/2);c.arc(0,h/2,w/3,Math.PI,0);c.stroke()}else if(type==='zigzag'){c.moveTo(-w,0);for(let i=0;i<6;i++)c.lineTo(-w+(i+1)*s/6,i%2?-h/2:h/2);c.stroke()}c.restore()}
function render(c,w=320,h=170,data=cfg){c.clearRect(0,0,w,h);c.fillStyle=data.bgColor;c.fillRect(0,0,w,h);c.lineWidth=data.stroke;c.lineCap=data.pixel?'square':'round';c.lineJoin=data.pixel?'miter':'round';c.strokeStyle=data.eyeColor;c.fillStyle=data.eyeColor;c.shadowColor=data.eyeColor;c.shadowBlur=data.glow;pathEye(c,data.left,160-data.gap/2,data.eyeY,data.eyeSize,false);pathEye(c,data.right,160+data.gap/2,data.eyeY,data.eyeSize,true);c.strokeStyle=data.accent?data.mouthColor:data.eyeColor;c.fillStyle=c.strokeStyle;c.shadowColor=c.strokeStyle;pathMouth(c,data.mouth,160,data.mouthY,data.mouthSize);c.shadowBlur=0}
function update(){for(const id of ['left','right','mouth','eyeColor','mouthColor','bgColor'])$(id).value=cfg[id];for(const [id] of rangeSpecs){$(id).value=cfg[id];$(id+'V').textContent=cfg[id]}linked.checked=cfg.linked;accent.checked=cfg.accent;pixel.checked=cfg.pixel;faceName.textContent=cfg.name||'Custom emoticon';readout.textContent=JSON.stringify(cfg);render(ctx);localStorage.setItem('lilbot-emoticon',JSON.stringify(cfg))}
for(const id of ['left','right','mouth','eyeColor','mouthColor','bgColor'])$(id).oninput=e=>{cfg[id]=e.target.value;if(id==='left'&&cfg.linked)cfg.right=cfg.left;cfg.name='Custom emoticon';update()};for(const [id] of rangeSpecs)$(id).oninput=e=>{cfg[id]=+e.target.value;cfg.name='Custom emoticon';update()};for(const id of ['linked','accent','pixel'])$(id).onchange=e=>{cfg[id]=e.target.checked;if(id==='linked'&&cfg.linked)cfg.right=cfg.left;update()};
for(const [key,p] of Object.entries(presets)){const b=document.createElement('button');b.className='preset';b.innerHTML=`<canvas width="320" height="170"></canvas><span>${p.name}</span>`;b.onclick=()=>{cfg={...p};update()};library.appendChild(b);render(b.querySelector('canvas').getContext('2d'),320,170,p)}
function dl(name,type,data){const a=document.createElement('a');a.download=name;a.href=URL.createObjectURL(new Blob([data],{type}));a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}png.onclick=()=>{render(ctx);const a=document.createElement('a');a.download='lilbot-emoticon.png';a.href=canvas.toDataURL();a.click();toast.textContent='Exported 320×170 PNG'};json.onclick=()=>{dl('lilbot-emoticon.json','application/json',JSON.stringify(cfg,null,2));toast.textContent='Exported settings'};copy.onclick=async()=>{await navigator.clipboard.writeText(JSON.stringify(cfg,null,2));toast.textContent='Settings copied'};reset.onclick=()=>{cfg={...base};update();toast.textContent='Reset to neutral'};update();
</script></body></html>
