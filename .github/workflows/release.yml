name: Build Lil Bot release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - VERSION
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
          fi
      - name: Build ESP32 firmware
        shell: bash
        run: |
          python -m pip install platformio
          python tools/generate_face_assets.py
          platformio run --project-dir firmware
          cp firmware/.pio/build/lilygo-t-display-s3-touch/firmware.bin firmware/lilbot-firmware.bin
      - name: Package Windows companion
        shell: bash
        run: |
          mkdir -p release/LilBot
          cp VERSION companion.py companion_config.json display-preview.html requirements.txt start_lilbot.bat github_updater.py check_for_updates.py check_for_updates.bat README.md ENCLOSURE_NOTES.md GITHUB_UPDATES.md PROTOCOL.md release/LilBot/
          mkdir -p release/LilBot/firmware
          cp firmware/platformio.ini firmware/partitions.csv firmware/README.md release/LilBot/firmware/
          cp -r firmware/src firmware/include firmware/data release/LilBot/firmware/
          cd release
          zip -r "LilBot-Windows-${{ steps.version.outputs.tag }}.zip" LilBot
          sha256sum "LilBot-Windows-${{ steps.version.outputs.tag }}.zip" > SHA256SUMS.txt
          if [ -f ../firmware/lilbot-firmware.bin ]; then
            cp ../firmware/lilbot-firmware.bin .
            sha256sum lilbot-firmware.bin >> SHA256SUMS.txt
          fi
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            release/LilBot-Windows-*.zip
            release/SHA256SUMS.txt
            release/lilbot-firmware.bin
          fail_on_unmatched_files: false
